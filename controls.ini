# Freecam controls. Change anything here, save, and restart the freecam.
#
# Use a comma for alternatives:      forward = Y, NUM8
# Use a plus for buttons held together:  toggle = L3+R3
# Leave a control empty to turn it off:  turn_left =
#
# The names you can use are listed in README.md.

[keyboard]
toggle = P
teleport = C
forward = Y, NUM8
back = N, NUM5
left = B, NUM4
right = M, NUM6
up = R, NUM9
down = V, NUM7
turn_left = U
turn_right = O
look_up = 7
look_down = 8
slower = Z
faster = X
mouse_look = MOUSE_RIGHT

[controller]
toggle = L3+R3
teleport = LB+RB
up = RT
down = LT
slower = LB
faster = RB
forward =
back =
left =
right =
turn_left =
turn_right =
look_up =
look_down =
# Which stick moves and which looks: left, right or none.
move_stick = left
look_stick = right

[settings]
# Stops the player moving while the freecam is on: yes or no.
freeze_player = yes
move_speed = 0.5
turn_speed = 0.03
look_speed = 0.02
stick_speed = 0.04
mouse_speed = 0.003
invert_stick_x = no
invert_stick_y = no
invert_mouse_y = no
# PCSX2's PINE slot, from Settings > Advanced.
pine_slot = 28011
